<!DOCTYPE html>

<html lang="th">
<head>

<meta charset="UTF-8">
<title>ผลการทดสอบสายตา</title>

<style>

body{
margin:0;
font-family:Arial;
background:#f5f7fb;
}

header{
background:linear-gradient(90deg,#4facfe,#00f2fe);
color:white;
padding:18px;
text-align:center;
font-size:22px;
}

.container{
display:flex;
justify-content:center;
gap:40px;
margin-top:50px;
}

.box{
background:white;
padding:25px;
border-radius:12px;
box-shadow:0 6px 18px rgba(0,0,0,0.1);
width:350px;
}

table{
width:100%;
border-collapse:collapse;
margin-top:15px;
}

th,td{
border:1px solid #ddd;
padding:10px;
text-align:center;
}

th{
background:#4facfe;
color:white;
}

.resultScore{
font-size:30px;
font-weight:bold;
margin:15px 0;
}

button{
margin-top:20px;
padding:10px 18px;
border:none;
background:#4CAF50;
color:white;
border-radius:6px;
cursor:pointer;
}

button:hover{
background:#43a047;
}

</style>

</head>

<body>

<header>
ผลการทดสอบสายตา
</header>

<div class="container">

<!-- ตารางค่ามาตรฐาน -->

<div class="box">

<h3>ตารางมาตรฐานสายตา</h3>

<table>

<tr>
<th>คะแนน</th>
<th>ระดับสายตา</th>
</tr>

<tr><td>0-1</td><td>20/200</td></tr>
<tr><td>2</td><td>20/100</td></tr>
<tr><td>3</td><td>20/70</td></tr>
<tr><td>4</td><td>20/50</td></tr>
<tr><td>5</td><td>20/40</td></tr>
<tr><td>6</td><td>20/30</td></tr>
<tr><td>7</td><td>20/25</td></tr>
<tr><td>8-10</td><td>20/20 (ปกติ)</td></tr>

</table>

</div>

<!-- ผลผู้ใช้ -->

<div class="box">

<h3>ผลการทดสอบของคุณ</h3>

<div class="resultScore" id="score"></div>

<table>

<tr>
<th>ข้อมูล</th>
<th>ผลลัพธ์</th>
</tr>

<tr>
<td>คะแนน</td>
<td id="scoreValue"></td>
</tr>

<tr>
<td>ระดับการมองเห็น</td>
<td id="visionValue"></td>
</tr>

<tr>
<td>คำแนะนำ</td>
<td id="advice"></td>
</tr>

</table>

<button onclick="restart()">ทดสอบใหม่</button>

</div>

</div>

<script>

let score = localStorage.getItem("visionScore")
let vision = localStorage.getItem("visionLevel")

document.getElementById("score").innerText = score + " / 10"
document.getElementById("scoreValue").innerText = score
document.getElementById("visionValue").innerText = vision

let adviceText=""

if(score >= 8){
adviceText="สายตาปกติ"
}
else if(score >=5){
adviceText="ควรพักสายตาและตรวจสายตาเพิ่มเติม"
}
else{
adviceText="ควรพบผู้เชี่ยวชาญด้านสายตา"
}

document.getElementById("advice").innerText = adviceText

function restart(){
window.location.href="index.html"
}

</script>

</body>
</html>
