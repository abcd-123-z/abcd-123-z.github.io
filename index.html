<!DOCTYPE html>

<html lang="th">
<head>

<meta charset="UTF-8">
<title>AI Eye Screening</title>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

<style>

body{
margin:0;
font-family:Arial;
background:#f5f7fb;
}

header{
background:linear-gradient(90deg,#4facfe,#00f2fe);
color:white;
padding:18px;
font-size:22px;
position:relative;
text-align:center;
}

#logoutBtn{
position:absolute;
right:20px;
top:15px;
background:#ff4d4d;
color:white;
border:none;
padding:10px 14px;
border-radius:6px;
cursor:pointer;
}

.container{
margin-top:30px;
background:white;
width:1100px;
margin:auto;
padding:25px;
border-radius:12px;
box-shadow:0 8px 20px rgba(0,0,0,0.1);
}

button{
padding:10px 16px;
margin:8px;
border:none;
border-radius:6px;
background:#4CAF50;
color:white;
cursor:pointer;
}

.main-layout{
display:flex;
justify-content:center;
gap:40px;
margin-top:20px;
}

.camera-box{
position:relative;
width:640px;
}

#canvas{
position:absolute;
left:0;
top:0;
}

#distanceStatus{
font-size:18px;
margin-top:10px;
}

#countdown{
font-size:24px;
color:#ff5722;
font-weight:bold;
}

#testCanvas{
border:3px solid black;
background:white;
margin-top:10px;
}

.controls button{
width:50px;
height:40px;
font-size:18px;
}

</style>

</head>

<body>

<header>
AI Eye Screening System
<button id="logoutBtn" onclick="logout()">ออกจากระบบ</button>
</header>

<div class="container">

<h2 style="text-align:center;">ระบบตรวจสุขภาพสายตา</h2>

<div style="text-align:center;">
<button onclick="startSystem()">เปิดกล้อง</button>
<button onclick="stopSystem()">หยุดระบบ</button>
</div>

<div class="main-layout">

<div>

<h3>กล้องตรวจจับใบหน้า</h3>

<div class="camera-box">
<video id="video" width="640" height="480" autoplay></video>
<canvas id="canvas" width="640" height="480"></canvas>
</div>

<div id="distanceStatus">กำลังตรวจจับระยะ...</div>
<div id="countdown"></div>

</div>

<div>

<h3>การทดสอบสายตา</h3>

<div id="timer">เวลา: 20 วินาที</div>

<canvas id="testCanvas" width="400" height="400"></canvas>

<div class="controls">

<button onclick="answer(5)">↖</button> <button onclick="answer(6)">↑</button> <button onclick="answer(7)">↗</button>

<br>

<button onclick="answer(4)">←</button> <button onclick="answer(0)">→</button>

<br>

<button onclick="answer(3)">↙</button> <button onclick="answer(2)">↓</button> <button onclick="answer(1)">↘</button>

</div>

</div>

</div>

</div>

<script>

if(localStorage.getItem("loggedIn") !== "true"){
window.location.href="login.html"
}

function logout(){
localStorage.removeItem("loggedIn")
window.location.href="login.html"
}

</script>

<script src="script.js"></script>

</body>
</html>
